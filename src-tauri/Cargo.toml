[package]
name = "periphos"
description = "PeriphOS desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "periphos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
periphos-core.workspace = true
periphos-storage.workspace = true
periphos-hid.workspace = true
periphos-logitech.workspace = true
periphos-apps.workspace = true
periphos-wooting.workspace = true
periphos-taskbar.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
