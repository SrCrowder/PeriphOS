[workspace]
resolver = "2"
members = ["src-tauri", "crates/periphos-core", "crates/periphos-storage", "crates/periphos-hid", "crates/periphos-logitech", "crates/periphos-apps", "crates/periphos-wooting", "crates/periphos-taskbar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SrCrowder/PeriphOS"
rust-version = "1.77"

[workspace.dependencies]
periphos-core = { path = "crates/periphos-core" }
periphos-storage = { path = "crates/periphos-storage" }
periphos-hid = { path = "crates/periphos-hid" }
periphos-logitech = { path = "crates/periphos-logitech" }
periphos-apps = { path = "crates/periphos-apps" }
periphos-wooting = { path = "crates/periphos-wooting" }
periphos-taskbar = { path = "crates/periphos-taskbar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
