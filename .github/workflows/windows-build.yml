name: Windows build

# Builds unsigned Windows installers for testing. Download them from the
# "Artifacts" section of a workflow run. Not an official release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: PeriphOS-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
